name: Release App

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v0.1.2, etc.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.release-profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release-profile: linux-and-android
          - os: windows-latest
            release-profile: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-0 libsecret-1-dev libjson-glib-dev appstream desktop-file-utils

      - name: Install FastForge CLI
        run: dart pub global activate fastforge

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build packages with FastForge
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge release --name ${{ matrix.release-profile }}
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.release-profile }}
          path: dist/
          retention-days: 1

  create-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display fetched artifacts
        run: ls -laR all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
