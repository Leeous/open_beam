info:
  name: Complete pairing
  type: http
  seq: 3

http:
  method: PUT
  url: https://10.0.0.81:7345/pairing/pair
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "DEVICE_ID": "{{DEVICE_ID}}",
        "CHALLENGE_TYPE": 1,
        "RESPONSE_VALUE": "4199", 
        "PAIRING_REQ_TOKEN": 756842
      }
  auth: inherit

runtime:
  variables:
    - name: DEVICE_ID
      value: default_id
    - name: DEVICE_NAME
      value: default_name

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
